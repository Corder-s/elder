<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>ElderCare OS</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #FAF8FF 0%, #F3E8FF 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #17133A;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: #FFFFFF;
      border: 1px solid #E8E1F5;
      border-radius: 24px;
      padding: 28px 24px;
      max-width: 340px;
      box-shadow: 0 10px 30px rgba(109, 40, 217, 0.08);
    }
    h1 {
      font-size: 20px;
      margin: 0 0 8px;
      color: #4C1D95;
    }
    p {
      font-size: 13px;
      line-height: 1.5;
      color: #686581;
      margin: 0 0 20px;
    }
    button {
      width: 100%;
      padding: 12px 18px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(90deg, #6D28D9, #8B5CF6);
      color: #FFFFFF;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>ElderCare OS</h1>
    <p>Unable to reach the ElderCare OS server. Please check your internet or USB tunnel connection and try again.</p>
    <button onclick="window.location.reload()">Retry Connection</button>
  </div>
</body>
</html>
